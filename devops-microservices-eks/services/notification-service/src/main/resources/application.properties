server.port=${PORT:8081}
spring.application.name=notification-service

# Graceful shutdown: on SIGTERM, Spring Boot stops accepting new requests
# but lets in-flight requests finish (up to the timeout below) before exiting.
# This is the Spring Boot equivalent of the manual SIGTERM/SIGINT handling
# you wrote by hand in the Auth (Node.js) service.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: expose health endpoint, split into liveness/readiness groups
# (K8s standard: /actuator/health/liveness and /actuator/health/readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Kafka connection — broker address and consumer group come from env vars
# so this is configurable per-environment (dev EC2 vs EKS), same as
# DB_HOST/DB_PORT-style config in the Auth service.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.devopsdemo.notification.dto
notification.kafka.topic.order-created=${ORDER_CREATED_TOPIC:order.created}

logging.level.com.devopsdemo.notification=INFO
