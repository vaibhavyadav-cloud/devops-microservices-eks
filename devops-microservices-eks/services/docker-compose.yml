services:
  # ------------------------------------------------------------------
  # Postgres — single instance, two databases (authdb, orderdb) created
  # by postgres-init/01-init-dbs.sh on first startup.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Kafka — KRaft mode (no separate Zookeeper container needed, this
  # is the modern way as of Kafka 3.x+). Single node acting as both
  # broker and controller — fine for dev/test, never do this in prod.
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Other containers reach Kafka at "kafka:9092" using the Docker Compose
      # network's built-in DNS (service name = hostname). This is why it's
      # "kafka:9092" here and not "localhost:9092".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------
  # Auth service (Node.js/Express)
  # ASSUMPTION: this compose file lives one level above auth-service/,
  # order-service/, notification-service/ — adjust `context` paths below
  # if your layout differs.
  # NOTE: verify JWT_SECRET is the actual env var name your Auth code
  # expects (I don't have that codebase in this session) — rename if needed.
  # ------------------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authdb
      JWT_SECRET: dev-secret-change-me
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ------------------------------------------------------------------
  # Order service (Go) — publishes "order.created" to Kafka on create
  # ------------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    environment:
      PORT: 8082
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orderdb?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_CREATED_TOPIC: order.created
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"

  # ------------------------------------------------------------------
  # Notification service (Java/Spring Boot) — consumes "order.created"
  # ------------------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    environment:
      PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: notification-service
      ORDER_CREATED_TOPIC: order.created
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  postgres_data:
